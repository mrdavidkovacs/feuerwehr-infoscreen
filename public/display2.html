<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Feuerwehr Infoscreen — Display 2</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="display display-slideshow">
  <main id="slideshow" class="slideshow" aria-live="polite">
    <img id="slide-a" class="slide active" alt="">
    <img id="slide-b" class="slide" alt="">
    <section id="empty-state" class="fallback hidden">
      <div class="fallback-card neutral">
        <div class="badge">Feuerwehr Infoscreen</div>
        <h1>Keine Bilder verfügbar</h1>
        <p>Lege Bilder in das konfigurierte IMAGE_DIR. Unterstützt werden jpg, jpeg, png, webp und gif.</p>
      </div>
    </section>
  </main>

  <script src="/js/display2.js" defer></script>
</body>
</html>
